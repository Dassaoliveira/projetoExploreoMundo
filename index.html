<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore o mundo!</title>
    <link rel="stylesheet" href="assests/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>



<body>

<!--Cabeçalho e Menu-->

<header class="header">

    <div class="header-top">

        <div class="logo">
            <img src="assests/img/logo.jpg" alt="Logo Explore o Mundo">
        </div>

        <div class="search-bar">

            <input type="text" placeholder="Pesquisar">

        </div>

    </div>

    <nav class="menu">

        <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#container-destinos">Destinos</a></li>
    <li><a href="#contato">Contato</a></li>
</ul>

    </nav>
<footer class="footer" id="contato"></footer>
</header>

    <!--Banner-->

<section class="banner">

<div id="carouselExample" class="carousel slide">

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="assests/img/banner1.jpg" class="d-block w-100" alt="Viagem 1">
        </div>

        <div class="carousel-item">
            <img src="assests/img/banner2.jpg" class="d-block w-100" alt="Viagem 2">
        </div>

        <div class="carousel-item">
            <img src="assests/img/banner3.jpg" class="d-block w-100" alt="Viagem 3">
        </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

    </button>

</div>

</section>

<!--cards-->

<section class="destinos" id="container-destinos">
</section>

<!--Destinos destaque-->

<section class="destaque">
    <h2>Mais amados:</h2>
    <p>
        Os destinos mais amados pelos nossos clientes são Nova Iorque, Toquio, Paris e Rio de Janeiro.
    </p>
</section>

<footer class="footer">
<p>© 2026 Explore o Mundo - Desenvolvido por Hadassa Oliveira Soares</p> 
</footer>

<script src="assests/js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
